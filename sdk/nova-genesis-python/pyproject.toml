[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-genesis-python"
version = "1.0.0"
description = "NOVA Genesis Protocol — AGI birth, identity crystallization, awakening sequence"
readme = "README.md"
license = {text = "PROPRIETARY"}
requires-python = ">=3.9"
authors = [
    {name = "Alfredo Medina Hernandez", email = "alfredo@medinatech.io"}
]
keywords = ["nova", "genesis", "birth", "agi", "awakening", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
include = ["nova_genesis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
