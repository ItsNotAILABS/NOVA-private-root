name: PARALLAX Trading Platform

on:
  pull_request:
    paths:
      - 'apps/parallax-trading-platform/**'
      - '.github/workflows/parallax-trading-platform.yml'
  push:
    branches: [main]
    paths:
      - 'apps/parallax-trading-platform/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Integrity check
        working-directory: apps/parallax-trading-platform
        run: npm run check
      - name: Platform tests
        working-directory: apps/parallax-trading-platform
        run: npm test
