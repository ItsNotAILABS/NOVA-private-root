name: NOVA Polyglot Coding Capsule

on:
  pull_request:
  push:
    branches: [main]

jobs:
  capsule:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run polyglot capsule tests
        run: python -m pytest capsule/polyglot/tests -q
      - name: Smoke language registry
        run: python capsule/polyglot/capsule_cli.py languages
      - name: Initialize demo workspace
        run: python capsule/polyglot/capsule_cli.py init-demo
      - name: Run Python demo
        run: python capsule/polyglot/capsule_cli.py run hello.py
      - name: Build frontend preview receipt
        run: python capsule/polyglot/capsule_cli.py run index.html
