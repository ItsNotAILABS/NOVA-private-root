name: SignalLens Edge

on:
  pull_request:
    paths:
      - 'products/signallens-edge/**'
      - '.github/workflows/signallens-edge.yml'
  push:
    branches: [ main ]
    paths:
      - 'products/signallens-edge/**'
      - '.github/workflows/signallens-edge.yml'

jobs:
  validate-signallens-edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/signallens-edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check SignalLens Edge
        run: npm run check
      - name: Validate product surface
        run: npm run validate
      - name: Execute runtime tests
        run: npm test
