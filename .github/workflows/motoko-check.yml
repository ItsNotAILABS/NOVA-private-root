# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║  NOVA SOVEREIGN BUILD CHECK                                               ║
# ║  © 2024-2026 Alfredo Medina Hernandez — NSCP-2025                         ║
# ║                                                                           ║
# ║  Uses the NOVA sovereign CLI (scripts/nova) — NO DFX REQUIRED.           ║
# ║  moc (Motoko compiler) is sourced directly without the DFX daemon.       ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

name: NOVA Sovereign Build Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**/*.mo'
      - 'nova.json'
      - 'dfx.json'
      - 'scripts/nova'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**/*.mo'
      - 'nova.json'
      - 'dfx.json'
      - 'scripts/nova'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nova-check:
    name: NOVA Sovereign Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install DFX SDK (for moc binary only)
      # DFX ships moc. We use DFX once here purely to get moc into the cache.
      # After this step, scripts/nova finds moc in ~/.cache/dfinity and uses it
      # directly — the DFX daemon is never started.
      uses: dfinity/setup-dfx@main
      with:
        dfx-version: '0.24.3'

    - name: Make NOVA CLI executable
      run: chmod +x scripts/nova

    - name: NOVA version
      run: ./scripts/nova version

    - name: NOVA stats
      run: ./scripts/nova stats

    - name: NOVA type check — all canisters
      id: nova_check
      run: |
        echo "=== NOVA SOVEREIGN TYPE CHECK ==="
        ./scripts/nova check 2>&1 | tee nova-check.log

    - name: Show errors on failure
      if: failure()
      run: |
        echo "=== NOVA CHECK ERRORS ==="
        grep -i "error\|type mismatch\|unbound\|syntax" nova-check.log || true

    - name: Report success
      if: success()
      run: |
        echo "╔══════════════════════════════════════════════════╗"
        echo "║  ✓ All NOVA canisters passed type check          ║"
        echo "║  Sovereign build verified — NSCP-2025            ║"
        echo "╚══════════════════════════════════════════════════╝"

    - name: Upload check log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nova-check-log
        path: nova-check.log
        retention-days: 7
