name: NOVA Native C/C++ Interface

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native:
    name: ${{ matrix.os }} native build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build native/build --config Release
      - name: Test
        run: ctest --test-dir native/build --output-on-failure -C Release
