name: NOVA Capsule Studio App

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/capsule-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: App smoke check
        run: npm run check
      - name: Docker build
        working-directory: .
        run: docker build -f apps/capsule-studio/Dockerfile -t nova-capsule-studio:ci .
