      - "docs/templates/NOVA_OPERATING_ORDERS.yaml"
      - "docs/templates/NOVA_GATES_SCORECARD.yaml"
    exposure_class: "RUNTIME_RESTRICTED"
  - model_id: "A-MODEL-VERDICT-LINEAGE"
    class: "M2"
    description: "Accepted verdict and reason trace lineage."
    parity_refs:
      - "docs/templates/NOVA_OPERATING_ORDERS.yaml"
      - "docs/templates/NOVA_MEMORY_RESIDENCY.yaml"
    exposure_class: "BUILDER_CONFIDENTIAL"
