  hierarchy_contract:
    root_model_id: "N1-CHRONO"
    nesting_required: true
    flat_topology_forbidden: true
    parent_link_required: true
    child_link_required: true
    transfer_protocol_ref: "docs/templates/NOVA_TRANSFER_PROTOCOL.yaml"
    gates_ref: "docs/templates/NOVA_GATES_SCORECARD.yaml"

  models:
    - id: "N1-CHRONO"
      name: "CHRONO"
      title: "Genesis Anchor"
      parent: null
