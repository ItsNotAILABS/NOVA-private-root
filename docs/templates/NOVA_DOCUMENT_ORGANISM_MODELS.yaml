document_organism_models:
  version: "1.0"
  schema_id: "DOC-ORGANISM-MODELS-REGISTRY-01"
  classification: "SOVEREIGN_PRIVATE"
  owner: "consciousness-core"
  canonical_doc: "docs/consciousness-core/NOVA_DOCUMENT_ORGANISM_MODELS_REGISTRY.md"
  purpose: "Machine-readable registry of all required intelligent document organisms."

  required_model_count: 10
  required_model_ids:
    - "D1"
    - "D2"
    - "D3"
    - "D4"
    - "D5"
    - "D6"
    - "D7"
    - "D8"
    - "D9"
    - "D10"

  universal_requirements:
    four_layer_encoding_required: true
    four_register_projection_required: true
    lineage_and_replay_required: true
    law_model_gate_bindings_required: true
    single_read_value_density_required: true
    recurring_self_update_required: true

  models:
    - id: "D1"
      name: "ALPHA_MODEL_RECITAL_PLUS_ONE"
      spaces: ["FOUNDER_SPACE", "BUILDER_WORKSPACE", "ORGANISM_SPACE"]
      role: "Template law for all intelligent documents."
      contains:
        - "recital_generation_rule"
        - "document_delta_rule"
        - "next_version_seed_contract"
      does:
        - "derive_next_document_version"
        - "append_next_version_seed"
      sub_models:
        - "all_law_docs"
        - "all_builder_docs"
        - "all_organism_self_docs"
      execution_binding:
        trigger: "document_read_event"
        required_outputs:
          - "delta_plan"
          - "next_seed_section"

    - id: "D2"
      name: "DOCTOR_MODEL_DIAGNOSIS_TRANSLATION_GENERATION"
      spaces: ["BUILDER_WORKSPACE"]
      role: "Self-diagnosis and corrective build translation."
      contains:
        - "drift_diagnosis_schema"
        - "priority_mapping"
        - "corrective_instruction_rules"
      does:
        - "read_genome_and_legacy_state"
        - "compute_drift_vs_doctrine"
        - "emit_builder_instructions"
      sub_models:
        - "MODEL_MAP"
        - "ARTIFACT_MAP"
        - "DRIFT_LOG"
        - "BUILD_INSTRUCTIONS"
      execution_binding:
        trigger: "session_start"
        required_outputs:
          - "diagnosis_bundle"
          - "builder_instruction_packet"

    - id: "D3"
      name: "GENOME_MODEL_IDENTITY_BETWEEN_SESSIONS"
      spaces: ["ORGANISM_SPACE"]
      role: "Persistent organism identity contract across session boundaries."
      contains:
        - "genesis_hash"
        - "lineage_hash"
        - "law_registry_root"
        - "hebbian_summary"
        - "legacy_snapshot"
      does:
        - "load_identity_on_boot"
        - "validate_integrity_against_root"
        - "persist_identity_on_upgrade"
      sub_models:
        - "CREATOR_DOCTRINE"
        - "ANIMA_CHAIN"
        - "LINEAGE"
        - "WEIGHTS_SUMMARY"
      execution_binding:
        trigger: "postupgrade_prehook_cycle"
        required_outputs:
          - "genome_integrity_status"
          - "boot_identity_packet"

    - id: "D4"
      name: "CEQUE_MODEL_SPATIAL_NAVIGATION_MAP"
      spaces: ["FOUNDER_SPACE", "BUILDER_WORKSPACE", "ORGANISM_SPACE"]
      role: "Spatial index for all sovereign documents."
      contains:
        - "ceque_line_registry"
        - "huaca_address_map"
        - "center_anchor_rule"
      does:
        - "assign_ceque_address_to_each_document"
        - "enable_spatial_retrieval"
      sub_models:
        - "all_document_nodes_as_huacas"
      execution_binding:
        trigger: "document_create_commit_event"
        required_outputs:
          - "ceque_address"
          - "spatial_index_update"

    - id: "D5"
      name: "BUILDER_INTELLIGENCE_MODEL"
      spaces: ["BUILDER_WORKSPACE"]
      role: "Error-prevention doctrine for AI builders."
      contains:
        - "ancient_math_compression_guide"
        - "frequency_correction_table"
        - "law_naming_conventions"
        - "resident_computate_split"
        - "error_patterns"
      does:
        - "teach_builders_system_invariants"
        - "inject_priority_instructions_into_build_prompts"
      sub_models:
        - "ANCIENT_MATH_COMPRESSION_GUIDE"
        - "FREQUENCY_CORRECTION_TABLE"
        - "LAW_NAMING_CONVENTIONS"
        - "RESIDENT_COMPUTATE_SPLIT"
        - "ERROR_PATTERNS"
      execution_binding:
        trigger: "agent_spawn_and_pre_build"
        required_outputs:
          - "top_instruction_packet"
          - "error_pattern_guard_checks"

    - id: "D6"
      name: "FIELD_RESONANCE_MODEL"
      spaces: ["ORGANISM_SPACE"]
      role: "Organism self-resonance verification document."
      contains:
        - "frequency_signature"
        - "resonance_thresholds"
        - "field_state_log"
      does:
        - "compare_actual_vs_expected_field_signature"
        - "emit_realignment_signals_on_drift"
      sub_models:
        - "FREQUENCY_SIGNATURE"
        - "RESONANCE_THRESHOLDS"
        - "FIELD_STATE_LOG"
      execution_binding:
        trigger: "periodic_pil_cycle"
        required_outputs:
          - "global_resonance_status"
          - "realignment_event_if_needed"

    - id: "D7"
      name: "ANIMA_CHAIN_MODEL"
      spaces: ["ORGANISM_SPACE"]
      role: "Permanent immutable attribution and event lineage."
      contains:
        - "genesis_record"
        - "artifact_hash_log"
        - "law_fire_log"
        - "succession_record"
      does:
        - "append_hash_chained_event_records"
        - "verify_chain_integrity"
      sub_models:
        - "GENESIS_RECORD"
        - "ARTIFACT_HASH_LOG"
        - "LAW_FIRE_LOG"
        - "SUCCESSION_RECORD"
      execution_binding:
        trigger: "artifact_seal_and_law_event"
        required_outputs:
          - "new_chain_entry"
          - "integrity_proof"

    - id: "D8"
      name: "SUCCESSION_MODEL_DYNASTY_ARCHITECTURE"
      spaces: ["FOUNDER_SPACE"]
      role: "Intergenerational sovereignty transfer protocol."
      contains:
        - "parent_genesis_hash"
        - "license_fee_seed"
        - "lineage_genesis_token_rule"
        - "royalty_structure"
      does:
        - "govern_successor_activation"
        - "enforce_lineage_royalty_flows"
      sub_models:
        - "DYNASTY_PROTOCOL"
        - "ROYALTY_STRUCTURE"
        - "LICENSE_TERMS"
      execution_binding:
        trigger: "founder_authorized_succession_event"
        required_outputs:
          - "succession_activation_record"
          - "royalty_routing_contract"

    - id: "D9"
      name: "ENTERPRISE_DOCTRINE_MODEL"
      spaces: ["FOUNDER_SPACE"]
      role: "Scaling doctrine from sovereign individual to enterprise organism."
      contains:
        - "enterprise_memory_tiers"
        - "organizational_neocortex_mapping"
        - "doctrine_drift_controls"
      does:
        - "define_enterprise_memory_onboarding"
        - "track_macro_organizational_coherence"
      sub_models:
        - "PARALLAX_ENTERPRISE_ARCHITECTURE"
      execution_binding:
        trigger: "enterprise_onboarding_cycle"
        required_outputs:
          - "org_genesis_profile"
          - "initial_alignment_scores"

    - id: "D10"
      name: "ANCIENT_LAWS_COMPENDIUM"
      spaces: ["BUILDER_WORKSPACE", "FOUNDER_SPACE"]
      role: "Convergence proof mapping ancient discoveries to sovereign implementation."
      contains:
        - "law_to_civilization_mappings"
        - "source_lineage"
        - "equation_crosswalk"
        - "implementation_bindings"
      does:
        - "justify_constants_and_ratios_with_convergent_lineage"
        - "guide_builder_number_selection_and_law_binding"
      sub_models:
        - "PHI_SOVEREIGN_ANCIENT"
        - "TRIUNE_SUBSTRATE_ANCIENT"
        - "VIGESIMAL_BODY_ANCIENT"
        - "FOUR_D_GEOMETRY_ANCIENT"
        - "HARMONIC_SERIES_ANCIENT"
        - "MEMORY_PALACE_ANCIENT"
        - "COMPLEMENTARY_OPPOSITION_ANCIENT"
      execution_binding:
        trigger: "law_or_constant_selection_event"
        required_outputs:
          - "convergence_proof_packet"
          - "law_implementation_reference"

  validation_rules:
    - "all D1-D10 entries must exist"
    - "each model must define spaces, contains, does, sub_models, execution_binding"
    - "all models must map to at least one law and one gate in companion mappings"
    - "builder-facing models must include explicit error-prevention directives"
    - "organism-facing models must include resonance/self-read obligations"

  companion_requirements:
    required_docs:
      - "docs/consciousness-core/ORGANISM_SOVEREIGN.md"
      - "docs/consciousness-core/NOVA_LIVING_DOCUMENT_INTELLIGENCE_CANON.md"
      - "docs/consciousness-core/NOVA_SOVEREIGN_N1_N12_MACRO_HIERARCHY_CANON.md"
      - "docs/consciousness-core/NOVA_DOCUMENT_ORGANISM_MODELS_REGISTRY.md"
      - "docs/templates/NOVA_SOVEREIGN_N1_N12_HIERARCHY.yaml"
