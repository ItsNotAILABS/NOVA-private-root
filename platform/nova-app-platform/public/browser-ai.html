<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NOVA Browser AI</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div>
        <p class="eyebrow">NOVA / Browser AI</p>
        <h1>First-Class Browser AI</h1>
        <p class="lede">Imported from potential-succotash/Vigil patterns: NeuroCore heartbeat, intent routing, browser action plans, memory temple, and receipt-backed platform execution.</p>
      </div>
      <div class="card">
        <h2>Status</h2>
        <pre id="status">loading...</pre>
      </div>
    </section>

    <section class="grid">
      <article class="card wide">
        <h2>Command</h2>
        <textarea id="command" placeholder="Example: summarize this page and save an operator note"></textarea>
        <div class="actions">
          <button id="run">Plan Command</button>
          <button id="snapshot">Send Page Snapshot</button>
        </div>
        <pre id="result">ready</pre>
      </article>
      <article class="card"><h2>Agents</h2><div id="agents"></div></article>
      <article class="card"><h2>History</h2><pre id="history">[]</pre></article>
    </section>
  </main>
  <script src="/public/platform-bridge.js"></script>
  <script src="/public/browser-ai.js"></script>
</body>
</html>
